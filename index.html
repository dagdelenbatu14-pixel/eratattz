<script>
// Gerçek sitede eren.jpg'yi background olarak eklemek için:
// #bg { background-image: url('eren.jpg'); }
async function loadBg() {
  const bg = document.getElementById('bg');
  const names = ['eren.jpg','eren.jpeg','eren.JPG','eren.JPEG','eren.png','eren.webp'];
  for (const name of names) {
    try {
      const buf = await window.fs.readFile(name);
      const arr = new Uint8Array(buf);
      let bin = '';
      const chunk = 8192;
      for (let i = 0; i < arr.length; i += chunk)
        bin += String.fromCharCode(...arr.subarray(i, i + chunk));
      const ext = name.split('.').pop().toLowerCase();
      const mime = ext==='png'?'image/png':ext==='webp'?'image/webp':'image/jpeg';
      bg.style.backgroundImage = `url(data:${mime};base64,${btoa(bin)})`;
      bg.style.backgroundSize = 'cover';
      bg.style.backgroundPosition = 'center';
    } catch(e) { continue; }
  }
}
loadBg();
</script>
